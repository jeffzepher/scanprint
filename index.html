<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="在设备本地完成照片裁剪、文字增强与多页 PDF 导出。"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css?v=2"><title>纸间 · 随身扫描</title></head>
<body><main><header><a class="brand" href="./"><span class="brand-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3M8 8h8v8H8z"/></svg></span>纸间 </a><button id="install" class="icon-button" aria-label="添加到桌面"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20H6zM9 11h6m-3-3v6m-1 5h2"/></svg>添加到桌面</button></header>

<section id="workspace"><div class="section-title"><h2>我的扫描 <span id="count">0 页</span></h2><button id="newDoc" class="text-button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新建</button></div><input id="docName" aria-label="文档名称" placeholder="为文档起个名字" value="我的扫描"><div id="pages" class="pages"></div><label class="import-card" for="files" tabindex="0" role="button" aria-label="导入照片"><span class="import-symbol"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v18H3zM3 17l6-6 4 4 3-3 5 5M7 7h1"/></svg></span><strong>导入照片</strong><span>支持多张照片</span></label><input type="file" id="files" accept="image/*" multiple hidden></section>
</main>
<div class="export-bar"><div><strong id="exportTitle">暂无页面</strong><small id="exportHint">导入照片开始扫描</small></div><button id="export" disabled><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg>导出 PDF</button></div>
<dialog id="editor"><div class="editor-head"><button id="closeEditor" class="text-button">取消</button><strong>编辑页面</strong><button id="savePage" class="text-button">完成</button></div><div class="canvas-wrap"><canvas id="preview"></canvas><svg id="cropOverlay" aria-label="拖动四个角调整裁剪范围"></svg></div><p id="editHint">拖动四角调整纸张边缘，点击“应用裁剪”拉正。</p><div class="edit-actions"><button id="autoCrop"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3M8 8h8v8H8z"/></svg>自动识别</button><button id="applyCrop"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v15h15M3 6h15v15"/></svg>应用裁剪</button><button id="rotate"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 3v7h7"/></svg>旋转</button><button id="reset"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 3 8M3 4v7h7M12 7v5l3 2"/></svg>重置</button></div><div class="modes" id="modes"><button data-mode="original" class="active">原图</button><button data-mode="natural">自然增强</button><button data-mode="text">文字增强</button><button data-mode="bw">黑白</button></div><label class="slider-label">亮度 <input type="range" id="brightness" min="-50" max="50" value="0"></label><label class="check"><input type="checkbox" id="ink"> 清理彩色笔迹 <small>适合白纸上的红蓝笔；重叠处可能丢字</small></label><p class="local-note">所有调整在本机完成。黑色手写与正文重叠暂不支持可靠去除。</p></dialog>
<dialog id="exportDialog"><h2>导出你的文档</h2><label>纸张大小<select id="paper"><option value="a4">A4 · 自动适配横竖方向</option><option value="image">跟随图片比例</option></select></label><label>导出质量<select id="quality"><option value="high">高清</option><option value="small">较小文件</option></select></label><div class="dialog-actions"><button id="cancelExport">取消</button><button id="confirmExport" class="primary">生成 PDF</button></div></dialog>
<dialog id="installDialog"><h2>把纸间放到桌面</h2><p>iPhone：在 Safari 中打开，点击分享按钮，选择“添加到主屏幕”。</p><p>Android：在 Chrome 菜单中选择“安装应用”或“添加到主屏幕”。</p><button id="closeInstall" class="primary">知道了</button></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="./app.js?v=2"></script></body></html>
